# HL-Pick — paste inside the nginx `server {}` block that serves your TLS site.
# Do NOT strip the /add-pick prefix and do NOT add a trailing-slash redirect:
# Next.js is built with basePath=/add-pick and canonicalizes to no trailing slash.
#
#   location ^~ /add-pick { ... }
#
# Keep this block BEFORE the catch-all `location /`.

location ^~ /add-pick {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
